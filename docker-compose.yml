version: '3.8'

services:
  layout-server:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=faster_rcnn_R_50_FPN_3x
      - CONFIDENCE_THRESHOLD=0.7
      - MAX_IMAGE_SIZE=4096
      - OCR_LANG=kor+eng
    volumes:
      - model_cache:/root/.layoutparser
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model_cache: